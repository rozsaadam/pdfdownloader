name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every day at 12:00 PM UTC
    - cron: "0 12 * * *"
  workflow_dispatch: # Allows you to run it manually from the Actions tab if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -sSf https://YOUR_APP_URL.streamlit.app > /dev/null
